name: build E2631 OpenWrt images

# Compilation happens here, not on the workstation: this box has no make/gcc/dtc
# and the WSL component stays disabled on purpose. Packaging and verification
# (tools/mkfactory.mjs, tools/verify_hdr_crc.mjs) run locally, because the
# official vendor package used as the version-header template never gets
# uploaded to GitHub.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  BASE_REPO: https://github.com/Zlion-Y/openwrt-sanechips-base
  BASE_SHA: db8b8d4130457dbe46558a7cea872dd2dae539e6

jobs:
  # Fast feedback on the slot tool: the runner has a native gcc, so this reports
  # compile errors in about ten seconds instead of after a forty minute world build.
  fwslot-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install the MTD headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends linux-libc-dev
      - name: compile natively with warnings as errors
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror \
            -o /tmp/e2631-fwslot \
            overlay/package/firmware/e2631-fwslot/src/e2631-fwslot.c
          /tmp/e2631-fwslot 2>&1 | tail -8 || true

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: e2631 }

      - name: install build essentials
        run: |
          sudo apt-get update
          # python3-distutils no longer exists on 24.04 (dropped with Python 3.12);
          # asking for it kills the job before the build starts.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache

      - name: fetch the pinned base tree
        run: |
          git init openwrt
          git -C openwrt remote add origin "$BASE_REPO"
          git -C openwrt fetch --depth 1 origin "$BASE_SHA"
          git -C openwrt checkout --detach FETCH_HEAD
          git -C openwrt submodule update --init --recursive -f || true

      - name: apply the E2631 overlay
        working-directory: e2631
        run: |
          ./apply.sh ../openwrt
          test -f ../openwrt/target/linux/sanechips/dts/zx279128s-zte-zxhn-e2631.dts
          test -f ../openwrt/tools/e2631-mkfactory.mjs
          grep -q zxhn-e2631 ../openwrt/target/linux/sanechips/base-files/etc/board.d/02_network
          grep -q Makefile.e2631 ../openwrt/target/linux/sanechips/image/Makefile
          grep -qx CONFIG_CMDLINE_FORCE=y ../openwrt/target/linux/sanechips/config-6.18 \
            || { echo "command line not forced: the vendor bootargs would take over"; exit 1; }
          ls ../openwrt/target/linux/sanechips/patches-6.18/029-*.patch \
             ../openwrt/target/linux/sanechips/patches-6.18/030-*.patch

      - name: restore the download and build dirs
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ow-${{ env.BASE_SHA }}-${{ hashFiles('e2631/apply.sh', 'e2631/overlay') }}
          restore-keys: ow-${{ env.BASE_SHA }}-

      - name: seed the configuration
        run: |
          cd openwrt
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          cp ../e2631/seed/e2631.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_DEVICE_sanechips_generic_DEVICE_zte_zxhn-e2631=y' .config \
            || { echo "the E2631 profile was not selected"; grep -i e2631 .config || true; exit 1; }
          # Invisible at build time, fatal on the device: without soft-float every
          # binary starts with SIGILL, because this SoC has no VFP.
          grep -q '^CONFIG_SOFT_FLOAT=y' .config \
            || { echo "soft-float is off in .config"; exit 1; }

      # Keep the whole log in a file: the tail of it is what usually hides the
      # first error, and an artifact is cheaper than another 45 minute guess.
      - name: build
        run: |
          set +e
          make -C openwrt -j"$(nproc)" world V=s > build.log 2>&1
          rc=$?
          set -e
          grep -n -E "Error [0-9]+($|:)|error:|Newer symbol|\(NEW\)" build.log | head -30
          tail -n 40 build.log
          echo "make world exited with $rc"
          exit $rc

      # The sysupgrade file is a tar holding the two payloads under
      # sysupgrade-<profile>/{kernel,root}; unpacking it here gives stable
      # names, instead of guessing at paths inside build_dir.
      - name: collect the artifacts
        run: |
          mkdir -p out/payload
          B=openwrt/bin/targets/sanechips/generic
          cp -t out "$B"/*.bin "$B"/*.manifest 2>/dev/null || true
          tar -xf "$B"/openwrt-*-sysupgrade*.bin -C out/payload
          # The slot tool is needed on the *vendor* system too, to write the first
          # OpenWrt image, so ship the bare cross-compiled ELF as well.
          ELF=$(find openwrt/build_dir -type f -name e2631-fwslot -not -path '*ipk*' | head -1)
          test -n "$ELF" || { echo "no built e2631-fwslot ELF found"; exit 1; }
          cp "$ELF" out/payload/e2631-fwslot
          readelf -h "$ELF" | sed -n 's/^\s*Flags:\s*\(.*\)$/\1/p'
          F=$(readelf -h "$ELF" | awk '/^ *Flags:/{print $2}')
          # EF_ARM_ABI_FLOAT_SOFT=0x200 must be set, EF_ARM_ABI_FLOAT_HARD=0x400 clear.
          [ $(( F & 0x200 )) -ne 0 ] && [ $(( F & 0x400 )) -eq 0 ] \
            || { echo "e2631-fwslot is not soft-float EABI5 (flags $F)"; exit 1; }
          ls -lR out

      - uses: actions/upload-artifact@v4
        with:
          name: e2631-images
          path: out
          if-no-files-found: error
          retention-days: 30

      - name: the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      # A failed run still has to bank the downloads and the toolchain: without
      # this the next attempt pays for them again. actions/cache@v4 saves in a
      # post step, which this runner skipped after a failed job.
      - name: save the download and build dirs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ow-${{ env.BASE_SHA }}-${{ hashFiles('e2631/apply.sh', 'e2631/overlay') }}
