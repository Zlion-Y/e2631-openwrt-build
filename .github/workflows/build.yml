name: build E2631 OpenWrt images

# Manual only since 2026-10-14. The build path of record is local: wsl/build.sh
# inside WSL against ~/openwrt, with collect.sh + tools/mkfactory.mjs packaging on
# the Windows side (the official vendor package used as the version-header
# template never gets uploaded here, so packaging could not happen in CI anyway).
# Two pushes to main each started a ~40 minute build nobody asked for, which is why
# push is no longer a trigger. This workflow stays as the fallback for a machine
# without WSL, and as the fast native -Werror check on the slot tool: run it from
# the Actions page (workflow_dispatch).

on:
  workflow_dispatch:

env:
  BASE_REPO: https://github.com/Zlion-Y/openwrt-sanechips-base
  BASE_SHA: db8b8d4130457dbe46558a7cea872dd2dae539e6

jobs:
  # Fast feedback on the slot tool: the runner has a native gcc, so this reports
  # compile errors in about ten seconds instead of after a forty minute world build.
  fwslot-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install the MTD headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends linux-libc-dev
      - name: compile natively with warnings as errors
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror \
            -o /tmp/e2631-fwslot \
            overlay/package/firmware/e2631-fwslot/src/e2631-fwslot.c
          /tmp/e2631-fwslot 2>&1 | tail -8 || true

      # The vendor package cannot be committed, so make one here: mkfactory.mjs
      # writes it and the C reader has to accept it - and reject the same file
      # with one byte of the kernel changed. This is the parser that runs on the
      # device before anything is written to flash.
      - name: read a package with the compiled tool
        run: |
          node tools/make_fixture.mjs /tmp/fix > /dev/null
          /tmp/e2631-fwslot check /tmp/fix/fixture.bin
          if /tmp/e2631-fwslot check /tmp/fix/fixture-broken.bin; then
            echo "the tool accepted a package with a corrupted kernel"
            exit 1
          fi
          echo ok: check accepts the package and rejects the altered one

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: e2631 }

      - name: install build essentials
        run: |
          sudo apt-get update
          # python3-distutils no longer exists on 24.04 (dropped with Python 3.12);
          # asking for it kills the job before the build starts.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache

      - name: fetch the pinned base tree
        run: |
          git init openwrt
          git -C openwrt remote add origin "$BASE_REPO"
          git -C openwrt fetch --depth 1 origin "$BASE_SHA"
          git -C openwrt checkout --detach FETCH_HEAD
          git -C openwrt submodule update --init --recursive -f || true

      - name: apply the E2631 overlay
        working-directory: e2631
        run: |
          ./apply.sh ../openwrt
          test -f ../openwrt/target/linux/sanechips/dts/zx279128s-zte-zxhn-e2631.dts
          test -f ../openwrt/tools/e2631-mkfactory.mjs
          grep -q zxhn-e2631 ../openwrt/target/linux/sanechips/base-files/etc/board.d/02_network
          grep -q Makefile.e2631 ../openwrt/target/linux/sanechips/image/Makefile
          grep -qx CONFIG_CMDLINE_FORCE=y ../openwrt/target/linux/sanechips/config-6.18 \
            || { echo "command line not forced: the vendor bootargs would take over"; exit 1; }
          ls ../openwrt/target/linux/sanechips/patches-6.18/029-*.patch \
             ../openwrt/target/linux/sanechips/patches-6.18/030-*.patch
          # The first-boot safety net has to be in the tree and runnable: an
          # overlay file without an exec bit installs, looks enabled, and then
          # never runs - which is the worst kind of empty insurance.
          for f in sbin/e2631-trial sbin/e2631-commit sbin/e2631-probe etc/init.d/e2631-trial; do
            test -x "../openwrt/target/linux/sanechips/base-files/$f" \
              || { echo "missing or not executable: base-files/$f"; exit 1; }
          done

      # Run 7 lost 57 minutes to a dtc "Lexical error: Unexpected
      # 'LED_FUNCTION_INET'", a symbol that does not exist in any header. dtc
      # only runs inside make world, so the board file is cross-checked here
      # instead: labels and #includes against the dtsi the target's kernel
      # patches add, dt-binding macros against the fetched headers.
      - name: offline device-tree cross-check
        working-directory: e2631
        run: |
          mkdir -p out/hdrs
          KV=$(basename "$(ls ../openwrt/target/linux/sanechips/config-*)" | sed 's/^config-//')
          test -n "$KV" || { echo "no config-<version> in the target"; exit 1; }
          echo "kernel series of the target: $KV"
          for h in leds/common.h gpio/gpio.h input/linux-event-codes.h; do
            f=out/hdrs/$(basename $(dirname $h)).h
            curl -sf -H 'Accept: application/vnd.github.raw' \
              "https://api.github.com/repos/torvalds/linux/contents/include/dt-bindings/$h?ref=v$KV" -o "$f" \
            || curl -sf -H 'Accept: application/vnd.github.raw' \
              "https://api.github.com/repos/torvalds/linux/contents/include/dt-bindings/$h?ref=master" -o "$f" \
            || echo "  could not fetch $h: macro names will not be checked"
          done
          node tools/dts_lint.mjs \
            overlay/target/linux/sanechips/dts/zx279128s-zte-zxhn-e2631.dts \
            ../openwrt/target/linux/sanechips/dts \
            ../openwrt/target/linux/sanechips/patches-6.18

      - name: restore the download and build dirs
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ow-${{ env.BASE_SHA }}-${{ hashFiles('e2631/apply.sh', 'e2631/overlay') }}
          restore-keys: ow-${{ env.BASE_SHA }}-

      - name: seed the configuration
        run: |
          cd openwrt
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          cp ../e2631/seed/e2631.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_DEVICE_sanechips_generic_DEVICE_zte_zxhn-e2631=y' .config \
            || { echo "the E2631 profile was not selected"; grep -i e2631 .config || true; exit 1; }
          # Invisible at build time, fatal on the device: without soft-float every
          # binary starts with SIGILL, because this SoC has no VFP.
          grep -q '^CONFIG_SOFT_FLOAT=y' .config \
            || { echo "soft-float is off in .config"; exit 1; }

      # Keep the whole log in a file AND show it as it goes: a redirected build is
      # silent for an hour, which is no way to watch a first attempt. pipefail
      # still carries make's own exit status through tee.
      - name: build
        run: |
          set +e
          make -C openwrt -j"$(nproc)" world V=s 2>&1 | tee build.log |
            grep --line-buffered -E '^>>> |\*\*\* |Error [0-9]|: error:|make: \*\*\*'
          rc=${PIPESTATUS[0]}
          set -e
          echo "make world exited with $rc"
          exit $rc

      # include/rootfs.mk sweeps ./etc/init.d/* and enables every service it
      # finds, printing "Enabling <name>". That log line is the only evidence
      # that the first-boot auto-revert is actually baked into the image rather
      # than merely present in the tree, so a build that lost it fails here.
      - name: the trial service is armed in the image
        run: |
          grep -q 'Enabling e2631-trial' build.log \
            || { echo "the rootfs build did not enable e2631-trial: no auto-revert in this image"; exit 1; }

      # The sysupgrade file is a tar holding the two payloads under
      # sysupgrade-<profile>/{kernel,root}; unpacking it here gives stable
      # names, instead of guessing at paths inside build_dir.
      - name: collect the artifacts
        run: |
          mkdir -p out/payload
          B=openwrt/bin/targets/sanechips/generic
          cp -t out "$B"/*.bin "$B"/*.manifest "$B"/config-* 2>/dev/null || true
          # The board .dtb on its own: boot readiness is checked against the
          # structure the kernel actually sees, not against the .dts source.
          DTB=$(find openwrt/build_dir -maxdepth 5 -name 'image-zx279128s-zte-zxhn-e2631.dtb' | head -1)
          test -n "$DTB" || { echo "no built board dtb found"; exit 1; }
          cp "$DTB" out/e2631.dtb
          # The kernel's own merged .config. bin/targets has no config-* file in
          # this tree, and OpenWrt's top-level .config only carries the symbols
          # its own menus expose - not the ones the target config file sets,
          # which is exactly what the boot-readiness screen has to see.
          KCFG=$(find openwrt/build_dir -maxdepth 5 -name '.config' 2>/dev/null |
            grep -E '/linux-[^/]+/linux-[^/]+/\.config$' | head -1)
          KV=$(sed -n 's/^KERNEL_PATCHVER:=\([0-9][0-9.]*\).*/\1/p' openwrt/target/linux/sanechips/Makefile)
          if [ -n "$KCFG" ]; then
            cp "$KCFG" "out/config-$KV"
            echo "kernel config: $KCFG -> out/config-$KV ($(wc -l < "out/config-$KV") lines)"
          else
            echo 'WARN no kernel .config found in build_dir: the artifact will not carry config-*'
          fi
          tar -xf "$B"/openwrt-*-sysupgrade*.bin -C out/payload
          # The slot tool is needed on the *vendor* system too, to write the first
          # OpenWrt image, so ship the bare cross-compiled ELF as well.
          ELF=$(find openwrt/build_dir -type f -name e2631-fwslot -not -path '*ipk*' | head -1)
          test -n "$ELF" || { echo "no built e2631-fwslot ELF found"; exit 1; }
          cp "$ELF" out/payload/e2631-fwslot
          file out/payload/e2631-fwslot
          # It has to run on the vendor system, which has no musl loader.
          file out/payload/e2631-fwslot | grep -q 'statically linked' \
            || { echo "e2631-fwslot is dynamically linked; -static did not take"; exit 1; }
          readelf -h "$ELF" | sed -n 's/^\s*Flags:\s*\(.*\)$/\1/p'
          F=$(readelf -h "$ELF" | awk '/^ *Flags:/{print $2}')
          # EF_ARM_ABI_FLOAT_SOFT=0x200 must be set, EF_ARM_ABI_FLOAT_HARD=0x400 clear.
          [ $(( F & 0x200 )) -ne 0 ] && [ $(( F & 0x400 )) -eq 0 ] \
            || { echo "e2631-fwslot is not soft-float EABI5 (flags $F)"; exit 1; }
          ls -lR out

      - uses: actions/upload-artifact@v4
        with:
          name: e2631-images
          path: out
          if-no-files-found: error
          retention-days: 30

      # After the upload on purpose: this has to be able to fail the run without
      # costing the artifact, which is what the static checks are compared with.
      # Passing the bootloader's CRCs only says the bytes are accepted. Whether
      # the system then boots is a separate question, and a kernel that hangs
      # after flash does not fall back by itself, so check the things that stop
      # a boot: root= against the partition order the dtb really creates, the
      # flash/squashfs/jffs2 drivers being built in, the command line beating
      # the vendor bootargs, USB and watchdog nodes staying disabled, and what
      # actually went into the root filesystem.
      - name: boot readiness (static)
        working-directory: e2631
        run: node tools/verify_img.mjs ../out --tree ../openwrt --target sanechips

      - name: the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      # A failed run still has to bank the downloads and the toolchain: without
      # this the next attempt pays for them again. actions/cache@v4 saves in a
      # post step, which this runner skipped after a failed job.
      - name: save the download and build dirs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ow-${{ env.BASE_SHA }}-${{ hashFiles('e2631/apply.sh', 'e2631/overlay') }}
