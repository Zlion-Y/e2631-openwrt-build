name: build E2631 OpenWrt images

# Compilation happens here, not on the workstation: this box has no make/gcc/dtc
# and the WSL component stays disabled on purpose. Packaging and verification
# (tools/mkfactory.mjs, tools/verify_hdr_crc.mjs) run locally, because the
# official vendor package used as the version-header template never gets
# uploaded to GitHub.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  BASE_REPO: https://github.com/Zlion-Y/openwrt-sanechips-base
  BASE_SHA: db8b8d4130457dbe46558a7cea872dd2dae539e6

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: e2631 }

      - name: install build essentials
        run: |
          sudo apt-get update
          # python3-distutils no longer exists on 24.04 (dropped with Python 3.12);
          # asking for it kills the job before the build starts.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache

      - name: fetch the pinned base tree
        run: |
          git init openwrt
          git -C openwrt remote add origin "$BASE_REPO"
          git -C openwrt fetch --depth 1 origin "$BASE_SHA"
          git -C openwrt checkout --detach FETCH_HEAD
          git -C openwrt submodule update --init --recursive -f || true

      - name: apply the E2631 overlay
        working-directory: e2631
        run: |
          ./apply.sh ../openwrt
          test -f ../openwrt/target/linux/sanechips/dts/zx279128s-zte-zxhn-e2631.dts
          grep -q Makefile.e2631 ../openwrt/target/linux/sanechips/image/Makefile
          ! grep -qx CONFIG_VFP=y ../openwrt/target/linux/sanechips/config-6.18 \
            || { echo "VFP still enabled: this SoC has no VFP, images would SIGILL"; exit 1; }

      - name: cache the download and build dirs
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ow-${{ env.BASE_SHA }}-${{ hashFiles('e2631/apply.sh', 'e2631/overlay') }}
          restore-keys: ow-${{ env.BASE_SHA }}-

      - name: seed the configuration
        run: |
          cd openwrt
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          cp ../e2631/seed/e2631.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_DEVICE_sanechips_generic_DEVICE_zte_zxhn-e2631=y' .config \
            || { echo "the E2631 profile was not selected"; grep -i e2631 .config || true; exit 1; }

      - name: build
        run: make -C openwrt -j$(nproc) -j1 world V=s 2>&1 | tail -400

      - name: collect the artifacts
        run: |
          mkdir -p out
          cp openwrt/bin/targets/sanechips/generic/*.bin out/ 2>/dev/null || true
          find openwrt/build_dir -maxdepth 3 \( -name 'openwrt-*-kernel' -o \
               -name 'openwrt-*-rootfs.bin' \) -exec cp -t out/ {} +
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: e2631-images
          path: out
          if-no-files-found: error
          retention-days: 30

      - name: build log on failure
        if: failure()
        run: tail -200 openwrt/*.log 2>/dev/null || true
